# Mechanical enforcement of Dropkick's central promise.
#
# "Dropkick cannot upload your data because Dropkick has no networking code" is
# only worth saying if something checks it. Run:  cargo deny check bans
#
# If one of these ever appears in the tree, the build fails and the claim gets
# revisited honestly rather than quietly becoming false.

[bans]
multiple-versions = "allow"

deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "h2" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "tokio-tungstenite" },
    { name = "tungstenite" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    { name = "socket2" },
    { name = "mio", wrappers = ["calloop"] },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0"]

[advisories]
yanked = "warn"
