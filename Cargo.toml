[workspace]
members = ["crates/dropkick-core", "crates/dropkick-linux"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

# Dropkick summons and dismisses on a keystroke, so the binary is optimised for
# the resident case: one slow build, many fast frames.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
